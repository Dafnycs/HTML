<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <!-- 
    <Form> = Define um formulário
    <input> = Campo de entrada (com vário ti´pos: text, passaword, email, number e etc...)
    <label> = Associa um texto descritivo a um <input>
    <textarea> =Area do texto maior
    <select> e <option> = Criam menus suspensos (dropdowns)    
    <button> = Botão clicável   
    <fieldset> e <legend> = Agrupam e nomeiam partes de um formulário
    <datalist> = Lista de sugestão para <input>    
    -->

    <h1>Formulário Completo</h1>
    <form action="/enviar-dados" method="post">
        <fieldset>
            <legend>Informações Pessoais</legend>
            <label for="nome">Nome completo:</label>
            <input type="text" name="Nome" id="Nome" placeholder="Digete seu nome" requirer>


        </fieldset>



    </form>




</body>
</html>
