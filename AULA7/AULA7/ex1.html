<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AULA 07</title>
</head>
<body>
<!-- Como fazer tabela! -->
    <!-- TABELAS 
     <Table> = Define a tabela
     <thead> =Define a região do Cabeçalho
     <tr> = Define uma linha da tabela
     <th> = Define um cabeçalho (Deixa em negrito)
     <tbody> = Define a região do corpo
     <td> = Define uma célula (Dados da tabela)
     border = "1" = Adiciona bordas na tabela
     -->    
    
     <table border="1">
        <thead>
            <tr>
                <th>Nome</th>
                <th>Idade</th>
                <th>Cidade</th>
            </tr>
        </thead>
        <TBody>
            <tr>
                <td>Ana</td>
                <td>17</td>
                <td>Paris</td>
            </tr>
            <tr>
                <td>Vitoria</td>
                <td>17</td>
                <td>Cabul</td>
            </tr>
        </TBody>
     </table>





</body>
</html>
